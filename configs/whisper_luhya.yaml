# Whisper fine-tuning configuration for Luhya ASR.

# --- Data ---
dataset_name: "Digital-Divide-Data/Luhya-ASR-Data-subset-642H"
dataset_config: null

# The dataset provides only a single "train" split.
train_split: "train"
eval_split: null
test_split: null

text_column: "transcripts"
audio_column: "audio"

# --- Sampling / splitting ---
sample: true
sample_size: 15000
num_proc: 4

validation_split_pct: 0.2
test_split_pct: 0.1

seed: 42

# --- Model ---
model_name: "openai/whisper-small"
language: "luhya"
task: "transcribe"

# --- Model loading ---
torch_dtype: "float16"
low_cpu_mem_usage: true
use_safetensors: true

# --- Output ---
output_dir: "./outputs/whisper-small-luhya"

# --- Training hyperparameters ---
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 8

learning_rate: 0.00005
warmup_steps: 500

num_train_epochs: 2
max_steps: -1

# --- Evaluation / checkpointing ---
eval_steps: 50
save_steps: 50
logging_steps: 10

save_total_limit: 2
early_stopping_patience: 3

# --- Optimization ---
group_by_length: true
gradient_checkpointing: true
fp16: true
max_audio_length: 30.0

# --- Hub ---
push_to_hub: false
hub_model_id: null
