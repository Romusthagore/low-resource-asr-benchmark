# Full fine-tuning configuration: BuzzASR/swahili on Luhya ASR.
# No LoRA / PEFT. Keep separate from the original benchmark config.

# --- Data ---
dataset_name: "Digital-Divide-Data/Luhya-ASR-Data-subset-642H"
dataset_config: null
train_split: "train"
eval_split: null
test_split: null
text_column: "transcripts"
audio_column: "audio"

# --- Sampling and splits ---
sample: true
target_train_hours: 50
sample_size: null
num_proc: null
validation_split_pct: 0.1
max_eval_samples: 1000
test_split_pct: 0.1
seed: 42

# --- Model ---
model_name: "BuzzASR/swahili"
language: "luhya"
task: "transcribe"

# --- Loading and precision ---
torch_dtype: "float16"
low_cpu_mem_usage: true
use_safetensors: true
fp16: true
gradient_checkpointing: true

# --- Output ---
output_dir: "/network/scratch/a/ahomagnr/low-resource-asr-benchmark/outputs/buzzasr-swahili-luhya_nonreentrant_test"

# --- Training ---
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 32
learning_rate: 0.000005
warmup_steps: 100
num_train_epochs: 10
max_steps: -1

# --- Evaluation and checkpoints ---
eval_steps: 200
save_steps: 200
logging_steps: 10
save_total_limit: 2
early_stopping_patience: 3
group_by_length: true
max_audio_length: 30.0

# --- Hub ---
push_to_hub: false
hub_model_id: null
